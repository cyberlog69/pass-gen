<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914"/>
      <stop offset="50%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#1e133d"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="keyholeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Subtle Radial Ambient -->
  <circle cx="256" cy="256" r="180" fill="#7c3aed" fill-opacity="0.08"/>

  <!-- Outer Glow Filter Group -->
  <g filter="url(#shieldGlow)">
    <!-- Left Facet -->
    <path d="M 256,110 L 156,138 C 156,262 198,348 256,396 Z" fill="url(#facetLeft)"/>
    
    <!-- Right Facet -->
    <path d="M 256,110 L 356,138 C 356,262 314,348 256,396 Z" fill="url(#facetRight)"/>
    
    <!-- Outer Rim Outline -->
    <path d="M 256,110 L 356,138 C 356,262 314,348 256,396 C 198,348 156,262 156,138 Z" fill="none" stroke="#c4b5fd" stroke-width="4"/>
    
    <!-- Center Crease -->
    <path d="M 256,110 L 256,396" stroke="#ddd6fe" stroke-width="2.5" stroke-opacity="0.7"/>
    
    <!-- Keyhole Outer Cutout -->
    <path d="M 256,180 C 274,180 288,194.5 288,212.5 C 288,225 280.5,235.8 270.2,241.4 L 276.5,301 C 276.5,305.7 272.4,310 267.2,310 L 244.8,310 C 239.6,310 235.5,305.7 235.5,301 L 241.8,241.4 C 231.5,235.8 224,225 224,212.5 C 224,194.5 238,180 256,180 Z" fill="#0b0914" stroke="url(#keyholeGrad)" stroke-width="5"/>
    
    <!-- Keyhole Cyan Core -->
    <circle cx="256" cy="201" r="11" fill="#38bdf8"/>
  </g>
</svg>
