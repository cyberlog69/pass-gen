<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PassGen Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 32px auto; padding: 0 16px; background: #0a0a0f; color: #f1f1f5; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    #summary { font-size: 13px; margin-bottom: 20px; }
    #summary.pass { color: #22c55e; }
    #summary.fail { color: #ef4444; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
    li.pass { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); }
    li.fail { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <h1>PassGen Unit Tests</h1>
  <div id="summary">Running...</div>
  <ul id="results"></ul>

  <script>
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    let passed = 0, failed = 0;

    function assert(condition, msg) {
      const li = document.createElement('li');
      if (condition) {
        li.className = 'pass';
        li.textContent = '✓ ' + msg;
        passed++;
      } else {
        li.className = 'fail';
        li.textContent = '✗ ' + msg;
        failed++;
      }
      results.appendChild(li);
    }

    function assertApprox(a, b, tolerance, msg) {
      assert(Math.abs(a - b) <= tolerance, `${msg} (expected ${b} ± ${tolerance}, got ${a})`);
    }

    // We need the core functions. Load them via PassGen export.
    // First, create minimal DOM stubs so app.js doesn't crash.
    const stubIds = ['lengthSlider','lengthBox','passwordText','copyBtn','copyIcon','generateBtn','strengthText',
      'seg1','seg2','seg3','seg4','entropyInfo','historyWrap','historyList','clearHistBtn','toast',
      'tog-upper','tog-lower','tog-nums','tog-sym'];
    stubIds.forEach(id => {
      const el = document.createElement('div');
      el.id = id;
      if (id === 'tog-upper' || id === 'tog-lower' || id === 'tog-nums' || id === 'tog-sym') el.className = 'toggle-item active';
      document.body.appendChild(el);
    });
    const trackStub = document.createElement('div');
    trackStub.className = 'strength-track';
    document.body.appendChild(trackStub);
  </script>
  <script src="../js/app.js"></script>
  <script>
    const { secureRandom, shuffle, calcEntropy, buildCharset, getActiveCharsets, CHARS, STRENGTH_LEVELS } = window.PassGen;

    // ── 1. secureRandom bounds ──
    (function () {
      for (let max = 1; max <= 256; max++) {
        for (let i = 0; i < 100; i++) {
          const r = secureRandom(max);
          assert(r >= 0 && r < max, `secureRandom(${max}) in bounds: ${r}`);
        }
      }
    })();

    // ── 2. secureRandom distribution (chi-squared-like) ──
    (function () {
      const max = 6, trials = 6000, expected = trials / max;
      const counts = new Array(max).fill(0);
      for (let i = 0; i < trials; i++) counts[secureRandom(max)]++;
      const chi2 = counts.reduce((s, c) => s + (c - expected) ** 2 / expected, 0);
      // With 5 degrees of freedom, 95th percentile is ~11.07. Use generous threshold.
      assert(chi2 < 20, `secureRandom distribution chi2=${chi2.toFixed(2)} (should be <20)`);
    })();

    // ── 3. shuffle preserves elements ──
    (function () {
      const original = [1, 2, 3, 4, 5, 6, 7, 8];
      const shuffled = shuffle([...original]);
      assert(shuffled.length === original.length, 'shuffle preserves length');
      assert(shuffled.sort().join(',') === original.join(','), 'shuffle preserves elements');
      const isDifferent = shuffled.some((v, i) => v !== original[i]);
      assert(isDifferent || true, 'shuffle randomness check (non-deterministic)');
    })();

    // ── 4. buildCharset ──
    (function () {
      assert(buildCharset(['upper']) === CHARS.upper, 'buildCharset upper only');
      assert(buildCharset(['upper','lower']) === CHARS.upper + CHARS.lower, 'buildCharset upper+lower');
      assert(buildCharset([]) === '', 'buildCharset empty');
    })();

    // ── 5. calcEntropy ──
    (function () {
      // 16 chars from all 4 sets => pool = 26+26+10+32 = 94 => bits = floor(16 * log2(94))
      const poolAll = 26 + 26 + 10 + 32;
      const expectedAll = Math.floor(16 * Math.log2(poolAll));
      assert(calcEntropy(16, ['upper','lower','nums','symbols']) === expectedAll,
        `calcEntropy all sets: ${calcEntropy(16, ['upper','lower','nums','symbols'])}`);

      // 8 chars, only digits => pool = 10 => bits = floor(8 * log2(10))
      const poolNums = 10;
      const expectedNums = Math.floor(8 * Math.log2(poolNums));
      assert(calcEntropy(8, ['nums']) === expectedNums,
        `calcEntropy digits only: ${calcEntropy(8, ['nums'])}`);

      // Zero length
      assert(calcEntropy(0, ['upper']) === 0, 'calcEntropy zero length = 0');
    })();

    // ── 6. entropy / strength mapping ──
    (function () {
      function strengthLevel(bits) {
        if      (bits < 40) return 0;
        else if (bits < 60) return 1;
        else if (bits < 80) return 2;
        else                return 3;
      }
      // Weak: <40 bits
      assert(strengthLevel(calcEntropy(5, ['nums'])) === 0, '5 digit password is Weak');
      // Fair: 40-59
      assert(strengthLevel(calcEntropy(12, ['nums'])) === 1, '12 digit password is Fair');
      // Strong: 60-79
      assert(strengthLevel(calcEntropy(12, ['upper','lower','nums','symbols'])) >= 2, '12 char all-sets is Strong+');
      // Very Strong: >=80
      assert(strengthLevel(calcEntropy(24, ['upper','lower','nums','symbols'])) === 3, '24 char all-sets is Very Strong');
    })();

    // ── Summary ──
    const total = passed + failed;
    summary.textContent = `${passed}/${total} tests passed`;
    summary.className = failed === 0 ? 'pass' : 'fail';
  </script>
</body>
</html>
