<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PassGen Extended Unit Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; background: #0a0a0f; color: #f1f1f5; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    #summary { font-size: 14px; margin-bottom: 20px; font-weight: 600; }
    #summary.pass { color: #22c55e; }
    #summary.fail { color: #ef4444; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
    li.pass { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); }
    li.fail { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <h1>PassGen Unit Tests</h1>
  <div id="summary">Running tests...</div>
  <ul id="results"></ul>

  <!-- Minimal DOM stubs required by app.js -->
  <script>
    // Enable test-only PassGen API export (PATCH #4)
    window.__PASSGEN_TEST__ = true;

    const stubIds = [
      'tabPassword','tabPassphrase','tabPin','passwordOptions','passphraseOptions','pinOptions',
      'sliderLabel','lengthSlider','lengthBox','passBox','passwordText','copyBtn','copyIcon','qrBtn',
      'generateBtn','bulkBtn','strengthText','seg1','seg2','seg3','seg4','entropyInfo','crackTimeInfo',
      'strengthGuidance','historyWrap','historyList','clearHistBtn','toast','tog-upper','tog-lower',
      'tog-nums','tog-sym','tog-ambiguous','customSymbolsInput','resetSymbolsBtn','selectSeparator',
      'tog-capitalize','tog-passnum','bulkModal','bulkTitle','closeBulkModal','bulkCount','bulkTextarea',
      'copyBulkBtn','downloadBulkBtn','qrModal','qrTitle','closeQrModal','doneQrBtn','qrContainer'
    ];
    stubIds.forEach(id => {
      const el = document.createElement('div');
      el.id = id;
      if (id === 'tog-upper' || id === 'tog-lower' || id === 'tog-nums' || id === 'tog-sym' || id === 'tog-capitalize') {
        el.className = 'toggle-item active';
      }
      if (id === 'selectSeparator') {
        el.value = 'hyphen';
      }
      if (id === 'customSymbolsInput') {
        el.value = '!@#$%^&*()-_=+[]{}|;:,.<>?';
      }
      document.body.appendChild(el);
    });
    const trackStub = document.createElement('div');
    trackStub.className = 'strength-track';
    document.body.appendChild(trackStub);
  </script>

  <script src="../js/qrcode.js"></script>
  <script src="../js/words.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    let passed = 0, failed = 0;

    function assert(condition, msg) {
      const li = document.createElement('li');
      if (condition) {
        li.className = 'pass';
        li.textContent = '✓ ' + msg;
        passed++;
      } else {
        li.className = 'fail';
        li.textContent = '✗ ' + msg;
        failed++;
      }
      results.appendChild(li);
    }

    const {
      secureRandom,
      shuffle,
      calcEntropyBits,
      estimateCrackTime,
      buildCharset,
      getActiveCharsets,
      generateStandardPassword,
      generatePassphrase,
      generatePIN,
      getRelativeTime,
      getStrengthGuidance,
      CHARS,
      DEFAULT_SYMBOLS
    } = window.PassGen;

    // ── 1. EFF Wordlist ──
    (function () {
      assert(Array.isArray(window.EFF_WORDS), 'EFF_WORDS array loaded');
      assert(window.EFF_WORDS.length > 500, `Wordlist contains ${window.EFF_WORDS.length} words`);
      assert(Object.isFrozen(window.EFF_WORDS), 'EFF_WORDS is frozen against tampering');
    })();

    // ── 2. secureRandom Bounds ──
    (function () {
      for (let max = 1; max <= 100; max++) {
        const r = secureRandom(max);
        assert(r >= 0 && r < max, `secureRandom(${max}) in bounds: ${r}`);
      }
    })();

    // ── 3. Ambiguous Character Filtering & Custom Symbols ──
    (function () {
      const toggleStubs = [
        document.getElementById('tog-upper'),
        document.getElementById('tog-lower'),
        document.getElementById('tog-nums'),
        document.getElementById('tog-sym')
      ];
      const withAmbiguous = getActiveCharsets(toggleStubs, false, DEFAULT_SYMBOLS).join('');
      const withoutAmbiguous = getActiveCharsets(toggleStubs, true, DEFAULT_SYMBOLS).join('');

      assert(withAmbiguous.includes('l') && withAmbiguous.includes('1') && withAmbiguous.includes('O'), 'Default includes ambiguous chars');
      assert(!withoutAmbiguous.match(/[l1IO0oQS5Z2]/), 'Exclude ambiguous strips l, 1, I, O, 0, o, Q, S, 5, Z, 2');

      const customCharSet = getActiveCharsets(toggleStubs, false, '#@%').join('');
      assert(customCharSet.includes('#') && customCharSet.includes('@') && !customCharSet.includes('^'), 'Custom symbols override works properly');
    })();

    // ── 4. Passphrase Generator ──
    (function () {
      const pass1 = generatePassphrase(4, '-', true, false);
      const parts1 = pass1.split('-');
      assert(parts1.length === 4, `Passphrase word count 4: ${pass1}`);
      assert(parts1.every(w => w.charAt(0) === w.charAt(0).toUpperCase()), 'Passphrase capitalization works');

      const pass2 = generatePassphrase(5, '.', false, true);
      const parts2 = pass2.split('.');
      assert(parts2.length === 5, `Passphrase separator period: ${pass2}`);
      assert(/\d+/.test(pass2), 'Passphrase appends number when requested');
    })();

    // ── 5. PIN Generator ──
    (function () {
      for (const len of [4, 6, 8, 12, 16]) {
        const pin = generatePIN(len);
        assert(pin.length === len, `PIN of length ${len} generated`);
        assert(/^\d+$/.test(pin), `PIN contains numeric digits only: ${pin}`);
      }
    })();

    // ── 6. Relative Time Formatter ──
    (function () {
      const now = Date.now();
      assert(getRelativeTime(now) === 'Just now', 'getRelativeTime just now');
      assert(getRelativeTime(now - 45000) === '45s ago', 'getRelativeTime seconds');
      assert(getRelativeTime(now - 180000) === '3m ago', 'getRelativeTime minutes');
    })();

    // ── 7. Strength Guidance ──
    (function () {
      const g1 = getStrengthGuidance('password', 25, { len: 6, hasSymbols: false });
      assert(g1.status === 'alert', 'Short password receives alert status');

      const g2 = getStrengthGuidance('pin', 20, { len: 6 });
      assert(g2.status === 'warn', '6-digit PIN receives warn/info status');

      const g3 = getStrengthGuidance('passphrase', 90, { wordCount: 6 });
      assert(g3.status === 'good', '6-word passphrase receives good status');
    })();

    // ── 8. QR Code SVG Generator ──
    (function () {
      assert(typeof window.QRCode !== 'undefined', 'QRCode module loaded');
      const matrix = window.QRCode.generateQRCodeMatrix('PassGenTest');
      assert(matrix.size >= 21, 'QRCode matrix dimension valid');
      const svg = window.QRCode.generateSVG('PassGenTest');
      assert(svg instanceof SVGElement, 'QRCode generateSVG returns valid SVGElement');
    })();

    // ── 9. Entropy & Crack Time Calculations ──
    (function () {
      const bitsPass = calcEntropyBits('password', { len: 16, activeSets: [CHARS.upper, CHARS.lower, CHARS.nums, CHARS.symbols] });
      assert(bitsPass > 90, `Standard 16-char password entropy: ${bitsPass} bits`);

      const bitsPin = calcEntropyBits('pin', { len: 6 });
      assert(bitsPin === 19, `6-digit PIN entropy: ${bitsPin} bits`);

      assert(estimateCrackTime(20) === 'Instant', 'Low entropy crack time is Instant');
      assert(estimateCrackTime(100).includes('years'), `High entropy crack time: ${estimateCrackTime(100)}`);
    })();

    // ── Summary ──
    const total = passed + failed;
    summary.textContent = `${passed}/${total} tests passed`;
    summary.className = failed === 0 ? 'pass' : 'fail';
  </script>
</body>
</html>
