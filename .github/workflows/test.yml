name: PassGen Automated CI & Cryptography Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  web-tests:
    name: Web PWA & Cryptography Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Cryptography & PWA Test Suite
        run: node tests/run-tests.js
