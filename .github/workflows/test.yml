name: PassGen Automated CI & Build Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-tests:
    name: Web PWA & Cryptography Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Test Suite
        run: node tests/run-tests.js

  android-ci:
    name: Android Compose Tests & Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Compute APK Checksum
        run: |
          cd android
          find app/build/outputs/apk/release -name "*.apk" -exec sha256sum {} +

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassGen-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
